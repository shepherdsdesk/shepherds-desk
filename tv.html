<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC 셔틀버스 · 운행 현황판</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--navy:#1B2B5C;--teal:#0F766E;--bg:#0B1220;--card:#131C2E;--line:#1F2A40;--sub:#94A3B8;--y:#93C5FD;--p:#5EEAD4;--amber:#F59E0B;--ink:#F8FAFC;--chip:#1E293B;--deco:#93C5FD}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background .6s,color .6s;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.02em;overflow:hidden}
  body.idle{cursor:none}
  .tv{height:100vh;display:flex;flex-direction:column;gap:1.2vmin;padding:1.6vmin 1.8vmin}
  .tv>.main{flex:1}
  header{display:flex;align-items:center;gap:1.6vmin}
  .logo{width:6vmin;height:6vmin;border-radius:1.6vmin;background:var(--navy);display:grid;place-items:center;border:.25vmin solid var(--line)}
  .logo svg{width:58%;height:58%}
  header h1{margin:0;font-size:3.6vmin;font-weight:900;line-height:1.1}
  header small{display:block;font-size:1.9vmin;color:var(--sub);font-weight:600}
  .live{display:flex;align-items:center;gap:1vmin;font-size:2vmin;font-weight:800;color:#FCA5A5;margin-left:2vmin}
  .live i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#EF4444}
  .live.ok{color:#86EFAC}.live.ok i{background:#22C55E;animation:lp 1.6s infinite}
  @keyframes lp{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 1.4vmin rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .clock{margin-left:auto;text-align:right}
  .clock b{display:block;font-size:5.4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .clock span{font-size:1.9vmin;color:var(--sub);font-weight:700}
  .notice{display:flex;gap:1.2vmin;align-items:center;background:#2A1C08;border:.25vmin solid #8A5A12;color:#FCD34D;border-radius:1.6vmin;padding:1.2vmin 2vmin;font-size:2.6vmin;font-weight:800}
  .main{display:grid;grid-template-columns:1.25fr 1fr .8fr;grid-template-areas:"map boards times";gap:1.6vmin;min-height:0}
  .mapbox{grid-area:map}.boards{grid-area:boards}.times{grid-area:times}
  /* 시간표 */
  .times{background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:1vmin;overflow:hidden;min-height:0}
  .times>h2{margin:0;display:flex;align-items:baseline;gap:1vmin;font-size:2.7vmin;font-weight:900}
  .times>h2 small{margin-left:auto;font-size:1.8vmin;color:var(--sub);font-weight:700}
  .ttr{display:flex;flex-direction:column;gap:.6vmin;padding-top:.9vmin;border-top:.15vmin solid var(--line)}
  .ttr h3{margin:0;display:flex;align-items:center;gap:1vmin;font-size:2.1vmin;font-weight:900}
  .ttr h3 i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin}
  .ttl{display:flex;flex-direction:column;gap:.5vmin}
  .ttl .lab{font-size:1.75vmin;color:var(--sub);font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:.6vmin}
  .chips b{background:var(--chip);color:var(--ink);border-radius:.8vmin;padding:.4vmin 1vmin;font-size:2.2vmin;font-weight:800;font-variant-numeric:tabular-nums}
  .chips b.first{background:var(--navy);color:#fff;box-shadow:0 0 0 .25vmin #93C5FD}
  .ttr.park .chips b.first{background:var(--teal);box-shadow:0 0 0 .25vmin #5EEAD4}
  .chips .none{font-size:1.9vmin;color:#64748B;font-weight:700}
  /* 화면 방향 고르기 */
  .ctl{position:fixed;left:50%;bottom:1.4vmin;transform:translateX(-50%);z-index:2000;display:flex;gap:1vmin;align-items:center;background:rgba(11,18,32,.92);border:.2vmin solid var(--line);border-radius:1.4vmin;padding:.8vmin;transition:opacity .3s}
  .ctl button{white-space:nowrap;border:0;background:var(--chip);color:var(--ink);border-radius:1vmin;padding:1vmin 1.5vmin;font:inherit;font-size:1.8vmin;font-weight:800;cursor:pointer}
  .ctl button.on{background:#F59E0B;color:#0B1220}
  .ctl button:focus-visible{outline:.4vmin solid #FCD34D;outline-offset:.2vmin}
  .ctl span{white-space:nowrap;font-size:1.6vmin;color:var(--sub);font-weight:700;margin:0 .4vmin 0 1vmin}
  body.idle .ctl{opacity:0;pointer-events:none}
  /* TV를 세로로 세웠는데 화면이 가로로 나올 때: 화면을 90도 돌림 */
  body.rot-r .tv,body.rot-l .tv{position:fixed;width:100vh;height:100vw;transform-origin:0 0}
  body.rot-r .tv{top:0;left:100vw;transform:rotate(90deg)}
  body.rot-l .tv{top:100vh;left:0;transform:rotate(-90deg)}
  .mapbox{position:relative;border-radius:2vmin;overflow:hidden;border:.2vmin solid var(--line);min-height:0}
  #map{position:absolute;inset:0;background:#111A2B}
  #map .leaflet-tile-pane,#map.is-kakao img{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92)}
  .legend{position:absolute;left:1.2vmin;bottom:1.2vmin;z-index:900;display:flex;gap:1.4vmin;align-items:center;background:rgba(11,18,32,.86);border:.2vmin solid var(--line);border-radius:1.2vmin;padding:.9vmin 1.4vmin;font-size:1.7vmin;font-weight:700;color:#CBD5E1}
  .legend span{display:inline-flex;align-items:center;gap:.7vmin}
  .legend i{width:1.6vmin;height:1.6vmin;border-radius:.4vmin;display:inline-block}
  .boards{display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
  .rt{flex:1;min-height:0;background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.4vmin;overflow:hidden}
  .rt h2{margin:0 0 .3vmin;display:flex;align-items:center;gap:1.2vmin;font-size:2.7vmin;font-weight:900}
  .rt h2 .sw{width:2vmin;height:2vmin;border-radius:.5vmin}
  .rt h2 small{margin-left:auto;font-size:1.9vmin;color:var(--sub);font-weight:700}
  .stop{display:flex;align-items:center;gap:1.6vmin;padding:.75vmin 0;border-top:.15vmin solid var(--line)}
  .stop:first-of-type{border-top:0}
  .stop .nm{flex:1;min-width:0}
  .stop .nm b{display:block;font-size:2.4vmin;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .nm span{font-size:1.6vmin;color:var(--sub);font-weight:600}
  .eta{text-align:right;white-space:nowrap}
  .eta b{font-size:4vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .eta b small{font-size:2.2vmin;font-weight:800;margin-left:.3vmin}
  .eta span{display:block;font-size:1.55vmin;color:var(--sub);font-weight:700;margin-top:.2vmin}
  .eta.soon b{color:#FCA5A5}
  .eta.sch b{font-size:2.9vmin;color:var(--ink);opacity:.85}
  .eta.none b{font-size:2.3vmin;color:#64748B}
  .next{margin-top:auto;display:flex;align-items:center;gap:.8vmin;flex-wrap:wrap;font-size:1.7vmin;color:var(--sub);font-weight:700;padding-top:.8vmin;border-top:.15vmin solid var(--line)}
  .next b{background:var(--chip);color:var(--ink);border-radius:.8vmin;padding:.35vmin 1vmin;font-size:2.05vmin;font-variant-numeric:tabular-nums}
  .next b.first{background:var(--navy);color:#fff}
  .rt.park .next b.first{background:var(--teal)}
  /* 교회 소식 자막 */
  .ticker{display:flex;align-items:stretch;background:var(--card);border:.2vmin solid var(--line);border-radius:1.4vmin;overflow:hidden;height:5.6vmin;flex:none}
  .ticker .tag{flex:none;display:flex;align-items:center;gap:.8vmin;background:var(--navy);color:#fff;font-size:2.2vmin;font-weight:900;padding:0 2vmin;white-space:nowrap}
  .ticker .tag i{width:1.2vmin;height:1.2vmin;border-radius:50%;background:#FCD34D}
  .tk-view{position:relative;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .tk-track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tk linear infinite}
  .tk-track span{font-size:2.6vmin;font-weight:800;color:var(--ink);padding-right:8vmin}
  .tk-track span::before{content:"●";color:var(--deco);font-size:1.4vmin;margin-right:1.4vmin;vertical-align:.4vmin}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  footer{display:flex;align-items:center;gap:1.6vmin;color:var(--sub);font-size:1.8vmin;font-weight:600;flex:none}
  footer .ftxt{min-width:0}
  footer .ftxt span{display:block;white-space:nowrap}
  footer .ftxt .site{font-size:1.5vmin;opacity:.75;margin-top:.2vmin}
  footer .qr{background:#fff;border-radius:1vmin;padding:.6vmin;width:8.5vmin;height:8.5vmin}
  footer .qr svg{width:100%;height:100%;display:block}
  footer b{color:var(--ink);font-size:2.3vmin;display:block}
  footer .credit{margin-left:auto;text-align:right;white-space:nowrap}
  footer .credit .tel{display:block;font-size:2.6vmin;font-weight:900;color:var(--ink)}
  footer .credit .tel em{font-style:normal;font-size:1.7vmin;color:var(--sub);font-weight:700;margin-right:.8vmin}
  footer .credit small{display:block;font-size:1.25vmin;opacity:.4;margin-top:.3vmin}
  body.portrait footer .credit .tel{font-size:3.4vmin}
  /* 지도 표시 */
  .mkc{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .pill{display:inline-flex;align-items:center;gap:.6vmin;white-space:nowrap;font-size:2.1vmin;font-weight:900;padding:.6vmin 1.3vmin .6vmin .7vmin;border-radius:999px;box-shadow:0 .4vmin 1.4vmin rgba(0,0,0,.5);border:.3vmin solid #0B1220;color:#fff}
  .pill .n{width:2.8vmin;height:2.8vmin;border-radius:50%;background:#fff;display:inline-grid;place-items:center;font-size:1.8vmin}
  .pill.out{background:#0B1220!important}
  .pill.out .n{color:#fff}
  .pill.old{opacity:.45}
  .pill svg{width:2vmin;height:2vmin}
  .stopmk{position:relative;width:2.4vmin;height:2.4vmin;border-radius:50%;background:#0B1220;border:.6vmin solid var(--y);box-sizing:border-box}
  .stoplab{position:absolute;bottom:calc(100% + .7vmin);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(11,18,32,.9);border:.15vmin solid var(--line);font-size:1.7vmin;font-weight:800;padding:.3vmin .9vmin;border-radius:.8vmin;color:#E2E8F0}
  /* 제목 띠 (장식 · 사진) */
  header{position:relative}
  header>*:not(.hdbg){position:relative;z-index:1}
  .hdbg{display:none;position:absolute;inset:0;border-radius:2vmin;overflow:hidden;z-index:0;background:var(--cardA,var(--card));border:.2vmin solid var(--line)}
  body.band header{padding:1.2vmin 1.8vmin}
  body.band .hdbg{display:block}
  .hdbg .ph{position:absolute;inset:0;background-size:cover;background-position:center}
  .hdbg .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--card) 0,var(--card) 22%,transparent 55%,transparent 72%,var(--card) 94%)}
  body.portrait .hdbg .ph::after{background:linear-gradient(90deg,var(--card) 0,var(--card) 30%,transparent 62%,var(--card) 100%)}
  .hdeco{margin-left:auto;height:8.5vmin;width:38vmin;color:var(--deco);opacity:.6}
  .hdeco:empty{display:none}
  header h1,.live,.clock b,.clock span{white-space:nowrap}
  body.portrait.band header h1{font-size:3.5vmin}
  body.portrait .clock b{font-size:4.8vmin}
  .hdeco:not(:empty)+.clock{margin-left:2vmin}
  body.portrait .hdeco{width:16vmin;opacity:.5}
  .hdeco svg{width:100%;height:100%;display:block}
  /* 밝은 테마 */
  body.light .live{color:#B91C1C}
  body.light .live.ok{color:#15803D}
  body.light #map .leaflet-tile-pane, body.light #map.is-kakao img{filter:none}
  body.light #map{background:#E5E7EB}
  body.light .legend{background:rgba(255,255,255,.92);color:#334155}
  body.light .stopmk{background:#fff}
  body.light .stoplab{background:rgba(255,255,255,.95);color:#0F172A}
  body.light .pill{border-color:#fff}
  body.light .pill.out{background:#fff!important;color:#14213D!important}
  body.light .eta.soon b{color:#DC2626}
  body.light .notice{background:#FFF7E6;border-color:#F3C77A;color:#92400E}
  body.light .ctl{background:rgba(255,255,255,.95)}
  body.light .chips .none,body.light .eta.none b{color:#94A3B8}
  /* 자막 빛줄기 · 강조 */
  .ticker{position:relative}
  .ticker .shine{position:absolute;top:0;bottom:0;left:0;width:22%;pointer-events:none;background:linear-gradient(105deg,transparent 0%,var(--shine,rgba(255,255,255,.35)) 50%,transparent 100%);opacity:0;transform:translateX(-120%);animation:shine 7s ease-in-out infinite;will-change:transform}
  @keyframes shine{0%{transform:translateX(-120%);opacity:0}3%{opacity:1}16%{transform:translateX(560%);opacity:1}17%,100%{transform:translateX(560%);opacity:0}}
  .ticker .tag i{animation:dotp 7s ease-in-out infinite}
  @keyframes dotp{0%,1%{transform:scale(1);box-shadow:none}5%{transform:scale(1.7);box-shadow:0 0 1.4vmin var(--deco)}11%,100%{transform:scale(1);box-shadow:none}}
  .tk-track span.hi{color:#FCD34D}
  body.light .tk-track span.hi{color:#B45309}
  .tk-track b.imp{display:inline-block;font-size:1.8vmin;font-weight:900;color:#0B1220;background:#F59E0B;border-radius:.6vmin;padding:.2vmin .9vmin;margin-right:1.2vmin;vertical-align:.3vmin}
  /* 날씨 */
  .hright{margin-left:auto;display:flex;align-items:center;gap:2.4vmin}
  .hright .clock{margin-left:0}
  .wx{display:flex;align-items:center;gap:1.2vmin;white-space:nowrap}
  .wx .wi{width:5.2vmin;height:5.2vmin;flex:none}
  .wx .wi svg{width:100%;height:100%;display:block}
  .wx b{display:block;font-size:4.2vmin;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .wx .wt{display:flex;flex-direction:column;gap:.3vmin}
  .wx .wd{font-size:1.75vmin;color:var(--sub);font-weight:700}
  .wx .wd i{font-style:normal;color:var(--ink)}
  .wx .pm{display:inline-block;border-radius:.6vmin;padding:0 .7vmin;font-weight:800;color:#0B1220}
  body.portrait .wx .wd.d2{display:none}
  body.portrait .wx b{font-size:3.6vmin}
  /* 계절 효과: 카드 뒤에서만 */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .tv{position:relative;z-index:1}
  .fx .f{position:absolute;top:-10vh;animation:fxfall linear infinite}
  .fx .f>span{display:block;animation:fxsway ease-in-out infinite alternate}
  .fx .f svg{display:block;width:100%;height:100%}
  @keyframes fxfall{from{transform:translateY(-10vh)}to{transform:translateY(120vh)}}
  @keyframes fxsway{from{transform:translateX(calc(var(--sw) * -1)) rotate(calc(var(--rt) * -1))}to{transform:translateX(var(--sw)) rotate(var(--rt))}}
  .fx .w{position:absolute;left:0;animation:fxwind linear infinite;opacity:0}
  @keyframes fxwind{0%{transform:translateX(-40vw);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(120vw);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .fx{display:none} .ticker .shine,.ticker .tag i{animation:none} }
  .hide{display:none!important}
  .toast{display:none}
  /* 세로 화면 */
  body.portrait .main{grid-template-columns:1fr;grid-template-rows:32% 1fr auto;grid-template-areas:"map" "boards" "times"}
  body.portrait header h1{font-size:4vmin}
  body.portrait .times>h2{font-size:3vmin}
  body.portrait .ttr{flex-direction:row;gap:2vmin}
  body.portrait .ttr h3{min-width:22vmin;align-self:flex-start;padding-top:.4vmin}
  body.portrait .ttr .ttls{flex:1;display:flex;flex-direction:column;gap:.8vmin}
  /* 노선 하나만 보여 줄 때 (tv.html?route=yatap) */
  body.one .rt{flex:1}
.stop .nm .wc{font-style:normal;display:inline-block;margin-left:.6vmin;padding:.1vmin .9vmin;border-radius:99vmin;background:#F59E0B;color:#fff;font-weight:800;font-size:1.5vmin;white-space:nowrap}
/* ===== 한 노선(평일) · 운행 없는 날(포스터) 화면 ===== */
.nextbox{grid-area:next;background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.8vmin;min-height:0}
.nextbox h2{margin:0;display:flex;align-items:baseline;gap:1vmin;font-size:2.8vmin;font-weight:900}
.nextbox h2 small{margin-left:auto;font-size:1.8vmin;color:var(--sub);font-weight:700}
.nxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(24vmin,1fr));gap:1.2vmin}
.nx{background:var(--chip);border-radius:1.6vmin;padding:1.2vmin 1.6vmin;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"lab lab" "t in" "sm sm";align-items:baseline;column-gap:1.4vmin}
.nx .lab{grid-area:lab;font-size:1.9vmin;color:var(--sub);font-weight:800}
.nx b{grid-area:t;font-size:6.2vmin;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.nx em{grid-area:in;font-style:normal;font-size:2.6vmin;font-weight:900;color:#FCD34D;white-space:nowrap}
.nx small{grid-area:sm;font-size:1.8vmin;color:var(--sub);font-weight:700}
.nx.done b{font-size:3.6vmin;color:#64748B}
body.light .nx em{color:#B45309}
.poster{grid-area:poster;position:relative;border-radius:2vmin;overflow:hidden;background:#000;border:.2vmin solid var(--line);min-height:0}
.poster .pbg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(3.5vmin) brightness(.45) saturate(1.2);transition:background-image 1s}
.poster .pslides{position:absolute;inset:1.2vmin}
.poster .pslides img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.1s ease}
.poster .pslides img.on{opacity:1}
.pdots{position:absolute;bottom:1.4vmin;left:50%;transform:translateX(-50%);display:flex;gap:1vmin;background:rgba(0,0,0,.35);padding:.7vmin 1.1vmin;border-radius:99vmin}
.pdots:empty{display:none}
.pdots i{width:1.3vmin;height:1.3vmin;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots i.on{background:#fff;transform:scale(1.25)}
/* 한 노선 (가로) */
body.one:not(.rest) .main{grid-template-columns:1.15fr 1fr .8fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"map boards times" "map next times"}
body.one:not(.rest):not(.portrait) .nx b{font-size:5.2vmin}
body.one .rt{padding:1.6vmin 2.2vmin}
body.one .rt h2{font-size:3.2vmin}
body.one .stop{padding:1vmin 0}
body.one .stop .nm b{font-size:3.2vmin}
body.one .stop .nm span{font-size:2.1vmin}
body.one .eta b{font-size:5.2vmin}
body.one .eta b small{font-size:3vmin}
body.one .eta span{font-size:2vmin}
body.one .eta.sch b{font-size:4.3vmin}
body.one .eta.none b{font-size:3.4vmin}
body.one .stop .nm .wc{font-size:2vmin}
body.one .chips b{font-size:2.6vmin}
/* 운행 없는 날 (가로): 포스터 60% + 다음 운행 안내 */
body.rest .main{grid-template-columns:1.55fr 1fr;grid-template-rows:minmax(0,1fr);grid-template-areas:"poster rest"}
body.rest .mapbox, body.rest .boards, body.rest .times, body.rest .nextbox{display:none!important}
body.rest.noposter .main{grid-template-columns:minmax(0,1fr);grid-template-areas:"rest"}
/* 세로 */
body.portrait.one:not(.rest) .main{grid-template-columns:1fr;grid-template-rows:34% auto auto minmax(0,1fr);grid-template-areas:"map" "boards" "next" "times"}
body.portrait.rest .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"poster" "rest"}
body.portrait.rest.noposter .main{grid-template-rows:minmax(0,1fr);grid-template-areas:"rest"}
body.one:not(.portrait) .nextbox .nxs{flex:1;align-content:center;grid-template-columns:1fr}
body.one:not(.portrait) .nx{grid-template-columns:auto auto 1fr;grid-template-areas:"lab lab lab" "t in sm"}
body.one:not(.portrait) .nx small{justify-self:end}
/* 포스터 액자: 포스터 색에 맞춘 은은한 바탕 + 둥근 모서리 그림자 */
.poster{background:var(--cardA,var(--card))!important}
.poster .pbg{inset:0!important;filter:none!important;background-image:none;opacity:0;transition:opacity 1.2s ease!important}
.poster .pslides{inset:2.6vmin 2.6vmin 4.6vmin!important}
.poster .pslides img{top:50%!important;left:50%!important;right:auto!important;bottom:auto!important;width:auto!important;height:auto!important;max-width:100%;max-height:100%;transform:translate(-50%,-50%);border-radius:1.2vmin;box-shadow:0 1.4vmin 3.6vmin rgba(0,0,0,.28),0 .2vmin .6vmin rgba(0,0,0,.18)}
body.light .poster .pslides img{box-shadow:0 1.4vmin 3.2vmin rgba(60,40,10,.22),0 0 0 .35vmin rgba(255,255,255,.9)}
.pdots{background:rgba(0,0,0,.18)!important;bottom:1.3vmin!important}
body.light .pdots i{background:rgba(0,0,0,.25)} body.light .pdots i.on{background:rgba(0,0,0,.65)}
/* 안내 칸 */
/* ===== 운행 없는 날 안내 칸 (타일 디자인) ===== */
.restbox{grid-area:rest;background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:2vmin;padding:2vmin 2.2vmin;display:flex;flex-direction:column;gap:1.4vmin;min-height:0;overflow:hidden}
.rb-head{grid-area:head;display:flex;flex-direction:column;gap:1.2vmin;justify-content:center;min-width:0}
.rb-top{display:flex;align-items:center;gap:1.6vmin}
.rb-ic{font-size:5.6vmin;line-height:1}
.restbox h2{margin:0;font-size:3.6vmin;font-weight:900;line-height:1.25;word-break:keep-all}
.rb-memo{margin:.5vmin 0 0;font-size:2.2vmin;font-weight:800;color:#FCD34D}
body.light .rb-memo{color:#B45309}
.rb-list{display:flex;flex-direction:column;gap:1vmin}
.rb-next{background:var(--chip);border-radius:1.6vmin;padding:1.2vmin 1.8vmin;display:flex;flex-direction:column;gap:.3vmin}
.rb-r{display:flex;align-items:center;gap:1vmin;font-size:1.9vmin;color:var(--sub);font-weight:800}
.rb-r i{width:1.4vmin;height:1.4vmin;border-radius:.4vmin}
.rb-next b{font-size:3.4vmin;font-weight:900;line-height:1.15}
.rb-next b em{font-style:normal;color:#FCD34D;margin-left:.6vmin}
body.light .rb-next b em{color:#B45309}
.rb-next small{font-size:1.7vmin;color:var(--sub);font-weight:700}
.rb-more{flex:1;display:flex;flex-direction:column;gap:1.2vmin;min-height:0}
.rb-sec{background:var(--chip);border-radius:1.6vmin;padding:1.4vmin 1.8vmin;display:flex;flex-direction:column;gap:1vmin;min-height:0;min-width:0}
.rb-sec h3{margin:0;font-size:2.1vmin;font-weight:900;color:var(--sub)}
.rb-verse{grid-area:verse}.rb-wor{grid-area:wor}.rb-week{grid-area:week}
.rb-verse p{margin:0;flex:1;display:flex;align-items:center;font-size:3vmin;font-weight:800;line-height:1.55;word-break:keep-all}
.rb-verse cite{align-self:flex-end;font-style:normal;font-size:1.9vmin;color:var(--sub);font-weight:800}
.wtiles{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(15vmin,1fr));gap:1vmin;align-content:center}
.wtile{background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:1.2vmin;padding:1.1vmin .6vmin;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:.15vmin;min-width:0}
.wtile .n{font-size:2vmin;font-weight:900;color:var(--deco)}
.wtile .ap{font-size:1.5vmin;color:var(--sub);font-weight:800}
.wtile .t{font-size:3.6vmin;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.wtile .pl{font-size:1.6vmin;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{flex:1;display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:.7vmin;align-content:center;align-items:stretch}
.wk .dh{text-align:center;font-size:1.8vmin;font-weight:900;color:var(--sub)}
.wk .dh.today{color:var(--deco)}
.wk .rn{display:flex;align-items:center;gap:.6vmin;font-size:1.7vmin;font-weight:900;white-space:nowrap;padding-right:.4vmin}
.wk .rn i{width:1.2vmin;height:1.2vmin;border-radius:.3vmin;flex:none}
.wk .c{background:var(--cardA,var(--card));border:.2vmin solid var(--line);border-radius:1vmin;text-align:center;padding:.8vmin .1vmin;display:flex;flex-direction:column;justify-content:center;min-width:0}
.wk .c b{font-size:2.2vmin;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.wk .c small{font-size:1.3vmin;color:var(--sub);font-weight:700}
.wk .c.off b{font-size:1.9vmin;color:var(--sub)}
.wk .c.today{border-color:var(--deco);box-shadow:inset 0 0 0 .2vmin var(--deco)}
/* 포스터와 함께: 말씀 · 예배 · 이번 주 운행을 10초마다 하나씩 */
body.rest:not(.noposter) .rb-more .rb-sec{display:none;flex:1;animation:rbin .6s ease}
body.rest:not(.noposter) .rb-more .rb-sec.on{display:flex}
@keyframes rbin{from{opacity:0;transform:translateY(.8vmin)}to{opacity:1;transform:none}}
.rb-dots{display:flex;gap:.8vmin;justify-content:center}
.rb-dots i{width:1vmin;height:1vmin;border-radius:50%;background:var(--line)}
.rb-dots i.on{background:var(--deco)}
body.rest.noposter .rb-dots{display:none}
/* 포스터 없는 날 (가로): 위 [안내 | 말씀] · 가운데 예배 · 아래 이번 주 운행, 화면 높이를 나눠 씀 */
body.rest.noposter .restbox{display:grid;gap:1.4vmin;padding:2vmin;grid-template-columns:1fr 1fr;grid-template-rows:1.05fr 1fr 1.1fr;grid-template-areas:"head verse" "wor wor" "week week"}
body.rest.noposter .restbox.nv{grid-template-areas:"head head" "wor wor" "week week"}
body.rest.noposter .restbox.nw{grid-template-rows:1fr 1.1fr;grid-template-areas:"head verse" "week week"}
body.rest.noposter .restbox.nv.nw{grid-template-rows:auto 1fr;grid-template-areas:"head" "week";grid-template-columns:1fr}
body.rest.noposter .rb-more{display:contents}
body.rest.noposter .rb-head{padding:0 1vmin}
body.rest.noposter .restbox h2{font-size:4.4vmin}
body.rest.noposter .rb-ic{font-size:7vmin}
body.rest.noposter .rb-next b{font-size:4vmin}
body.rest.noposter .rb-verse p{font-size:3.6vmin}
body.rest.noposter .wtiles{grid-template-columns:repeat(auto-fit,minmax(18vmin,1fr))}
body.rest.noposter .wtile .t{font-size:4.8vmin}
body.rest.noposter .wtile .n{font-size:2.4vmin}
body.rest.noposter .wtile .pl,body.rest.noposter .wtile .ap{font-size:1.9vmin}
body.rest.noposter .wk .c b{font-size:3vmin}
body.rest.noposter .wk .c small{font-size:1.7vmin}
body.rest.noposter .wk .dh{font-size:2.2vmin}
body.rest.noposter .wk .rn{font-size:2.1vmin}
/* 포스터 없는 날 (세로): 한 줄씩 위에서 아래로 */
body.portrait.rest.noposter .restbox{grid-template-columns:1fr;grid-template-rows:auto .85fr 1.3fr 1.25fr;grid-template-areas:"head" "verse" "wor" "week"}
body.portrait.rest.noposter .restbox.nv{grid-template-rows:auto 1.3fr 1.25fr;grid-template-areas:"head" "wor" "week"}
body.portrait.rest.noposter .restbox.nw{grid-template-rows:auto 1fr 1.25fr;grid-template-areas:"head" "verse" "week"}
body.portrait.rest.noposter .restbox.nv.nw{grid-template-rows:auto 1fr;grid-template-areas:"head" "week"}
body.portrait.rest .rb-head{flex-direction:row;align-items:center;gap:2vmin}
body.portrait.rest .rb-top{flex:1.1}
body.portrait.rest .rb-list{flex:1}
body.portrait.rest.noposter .wtiles{grid-template-columns:repeat(4,1fr)}
/* 포스터와 함께 (세로): 포스터 아래 [안내 | 바뀌는 칸] */
body.portrait.rest:not(.noposter) .restbox{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto;grid-template-areas:"head" "more";padding:1.6vmin 2vmin}
body.portrait.rest:not(.noposter) .rb-more{grid-area:more;min-height:24vmin}
body.portrait.rest:not(.noposter) .restbox h2{font-size:3.2vmin}
body.portrait.rest:not(.noposter) .wtiles{grid-template-columns:repeat(auto-fit,minmax(17vmin,1fr))}
/* 세로 TV 머리글: 시계가 잘리지 않게 날씨는 기온만 */
body.portrait .wx .wd{display:none}
body.portrait .hdeco{display:none}
body.portrait header h1{font-size:3.4vmin!important}
body.portrait header small{font-size:1.7vmin}
body.portrait .clock b{font-size:4.4vmin}
body.portrait .hright{gap:1.6vmin}
body.portrait .live{margin-left:1vmin}
.rb-next b em{white-space:nowrap}
body.portrait.rest .rb-next b em{display:block;margin:0}
body.rest.noposter:not(.portrait) .restbox{grid-template-rows:minmax(0,1fr) auto auto}
body.rest.noposter:not(.portrait) .restbox.nw{grid-template-rows:minmax(0,1fr) auto}
body.rest.noposter:not(.portrait) .restbox h2{font-size:4vmin}
body.rest.noposter:not(.portrait) .rb-ic{font-size:6vmin}
body.rest.noposter:not(.portrait) .rb-next b{font-size:3.4vmin}
body.rest.noposter:not(.portrait) .rb-verse p{font-size:3.1vmin}
body.rest.noposter:not(.portrait) .wtile{padding:.8vmin .6vmin}
body.rest.noposter:not(.portrait) .wtile .t{font-size:3.8vmin}
body.rest.noposter:not(.portrait) .wtile .n{font-size:2.1vmin}
body.rest.noposter:not(.portrait) .wtile .pl,body.rest.noposter:not(.portrait) .wtile .ap{font-size:1.6vmin}
body.rest.noposter:not(.portrait) .wk{gap:.6vmin}
body.rest.noposter:not(.portrait) .wk .c{padding:.6vmin .1vmin}
body.rest.noposter:not(.portrait) .wk .c b{font-size:2.5vmin}
body.rest.noposter:not(.portrait) .wk .c small{font-size:1.4vmin}
body.rest.noposter:not(.portrait) .wk .dh{font-size:1.9vmin}
body.rest.noposter:not(.portrait) .rb-sec{padding:1.1vmin 1.6vmin;gap:.7vmin}
body.rest.noposter:not(.portrait) .restbox:not(.nv) h2 br{display:none}
body.rest.noposter:not(.portrait) .restbox:not(.nv) h2{font-size:3.4vmin}
body.rest.noposter:not(.portrait) .restbox{grid-template-rows:auto auto auto;align-content:space-between}
.rb-verse .motto{font-size:2vmin;font-weight:800;color:var(--deco);display:flex;align-items:baseline;gap:.8vmin;flex-wrap:wrap}
.rb-verse .motto b{font-size:2.3vmin;color:var(--ink)}
.rb-verse .motto small{color:var(--sub);font-weight:700}
.wtile.wk2{background:transparent;border-style:dashed}
.wtile.wk2 .n{color:var(--sub)}
.wtile .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rest:not(.noposter):not(.portrait) .wtiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:.8vmin}
body.rest:not(.noposter):not(.portrait) .wtile{padding:.8vmin .4vmin}
body.rest:not(.noposter):not(.portrait) .wtile .t{font-size:3vmin}
body.rest:not(.noposter):not(.portrait) .wtile .n{font-size:1.6vmin}
body.rest:not(.noposter):not(.portrait) .wtile .ap,body.rest:not(.noposter):not(.portrait) .wtile .pl{font-size:1.35vmin}
body.portrait.rest:not(.noposter) .wtiles{grid-template-columns:repeat(4,minmax(0,1fr))!important}
/* 글꼴 선택 */
html,body{font-family:var(--ff,"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif)}
body[data-font=gmarket] h1,body[data-font=gmarket] b,body[data-font=gmarket] h2{letter-spacing:-.01em}
/* 교회 표어: 머리글 가운데 */
.hmotto{flex:1;min-width:0;text-align:center;padding:0 2vmin}
.hmotto span{display:inline-block;max-width:100%;font-size:2.7vmin;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.6vmin 2.2vmin;border-radius:99vmin;background:var(--chip);box-shadow:inset 0 0 0 .2vmin var(--line)}
body.hasmotto .hright{margin-left:0}
body.portrait header{flex-wrap:wrap;row-gap:.8vmin}
body.portrait .hmotto{order:20;flex-basis:100%;padding:0}
body.portrait .hmotto span{font-size:2.4vmin}
/* 미리 보기(관리자 화면 안) */
body.preview .ctl{display:none!important}
body.preview{cursor:default}
/* 포스터: 두 장 나란히 · 겹쳐 보기 */
.poster[data-view=two] .pslides img{max-width:48.5%}
.poster[data-view=two] .pslides img.l{transform:translate(-101.5%,-50%)}
.poster[data-view=two] .pslides img.r{transform:translate(1.5%,-50%)}
.poster[data-view=stack] .pslides img{max-width:60%;transition:transform 1s ease,opacity 1s ease,filter 1s ease}
.poster[data-view=stack] .pslides img.c{opacity:1;z-index:3}
.poster[data-view=stack] .pslides img.side{opacity:.5;z-index:1;filter:blur(.25vmin) saturate(.85)}
.poster[data-view=stack] .pslides img.side.l{transform:translate(-108%,-50%) scale(.76)}
.poster[data-view=stack] .pslides img.side.r{transform:translate(8%,-50%) scale(.76)}
.poster .pslides img{transition:opacity 1.1s ease,transform 1s ease}
/* 항상 보이기: 시간표 칸 자리에 포스터 — 번갈아(20초) / 포스터만 / 함께(위 시간표 · 아래 포스터) */
body.pside:not(.rest) .poster{grid-area:times}
body.pside.mx-poster:not(.rest) .times{display:none}
body.pside.mx-alt.pshow:not(.rest) .times{display:none}
body.pside.mx-alt:not(.pshow):not(.rest) .poster{display:none}
body.pside.mx-split:not(.rest) .poster{grid-area:ptr}
body.pside.mx-split:not(.rest):not(.one):not(.portrait) .main{grid-template-rows:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"map boards times" "map boards ptr"}
body.pside.mx-split.one:not(.rest):not(.portrait) .main{grid-template-rows:auto minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"map boards times" "map next times" "map next ptr"}
body.pside.mx-split.portrait:not(.rest):not(.one) .main{grid-template-columns:1fr 1fr;grid-template-rows:30% auto minmax(0,1fr);grid-template-areas:"map map" "boards boards" "times ptr"}
body.pside.mx-split.portrait.one:not(.rest) .main{grid-template-columns:1fr 1fr;grid-template-rows:30% auto auto minmax(0,1fr);grid-template-areas:"map map" "boards boards" "next next" "times ptr"}
/* 시간표 줄 간격 */
.ttls{display:flex;flex-direction:column;gap:1.5vmin}
.ttr{gap:1vmin!important;padding-top:1.4vmin!important}
.ttr+.ttr{margin-top:.6vmin}
.ttl{gap:.9vmin!important}
.chips{gap:.9vmin!important}
.times{gap:1.4vmin!important}
/* 글꼴 굵기: 굵게(기본) · 보통 · 가볍게 */
body.w-normal *{font-weight:600!important}
body.w-normal h1,body.w-normal h2,body.w-normal .clock b,body.w-normal .eta b,body.w-normal .chips b,body.w-normal .nx b,body.w-normal .wtile .t,body.w-normal .rb-next b,body.w-normal .restbox h2,body.w-normal .wx b,body.w-normal .hmotto span{font-weight:750!important}
body.w-light *{font-weight:400!important}
body.w-light h1,body.w-light h2,body.w-light .clock b,body.w-light .eta b,body.w-light .chips b,body.w-light .nx b,body.w-light .wtile .t,body.w-light .rb-next b,body.w-light .restbox h2,body.w-light .wx b,body.w-light .hmotto span,body.w-light .stop .nm b,body.w-light .rt h2{font-weight:600!important}
/* ---------- 유튜브 영상 (포스터 자리) ---------- */
.poster .pvid{position:absolute;inset:2.6vmin;display:none}
body.vid .poster .pvid{display:block}
body.vid .poster .pslides,body.vid .poster .pdots{display:none}
.poster .pvin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.poster .pvin iframe{border:0;display:block;background:#000;border-radius:1.2vmin;box-shadow:0 1.4vmin 3.6vmin rgba(0,0,0,.35),0 0 0 .3vmin rgba(255,255,255,.18)}
body.light .poster .pvin iframe{box-shadow:0 1.4vmin 3.2vmin rgba(60,40,10,.22),0 0 0 .35vmin rgba(255,255,255,.9)}
.poster .vwait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vmin;color:var(--ink);font-weight:700;font-size:2.2vmin;pointer-events:none}
.poster .vwait span{background:var(--cardA,var(--card));padding:.8vmin 1.8vmin;border-radius:99px;box-shadow:0 .4vmin 1.4vmin rgba(0,0,0,.12)}
.poster .vwait i{width:4.6vmin;height:4.6vmin;border-radius:50%;border:.5vmin solid currentColor;border-right-color:transparent;animation:vspin 1s linear infinite;opacity:.75}
@keyframes vspin{to{transform:rotate(360deg)}}
body.vplay .poster .vwait{display:none}
.poster .vlive{position:absolute;top:-1.4vmin;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:.8vmin;background:rgba(15,15,20,.78);color:#fff;font-size:1.7vmin;font-weight:700;letter-spacing:.06em;padding:.5vmin 1.4vmin;border-radius:99px;z-index:3}
.poster .vlive i{width:1.1vmin;height:1.1vmin;border-radius:50%;background:#EF4444;box-shadow:0 0 0 .4vmin rgba(239,68,68,.3);animation:vblink 1.6s ease-in-out infinite}
@keyframes vblink{50%{opacity:.35}}
body.vplay.vlivenow .poster .vlive{display:inline-flex}
/* 영상이 와도 지도·도착 칸 너비는 그대로 (글자가 줄바꿈되지 않게) */
body.portrait.pside:not(.one):not(.mx-split):not(.rest) .main{grid-template-rows:30% auto minmax(0,1fr)}
body.portrait.pside .poster{min-height:0}
@media (min-aspect-ratio:16/10) and (min-width:1500px){ body.vid.pside.mx-poster:not(.rest):not(.portrait):not(.rot-r):not(.rot-l) .main{grid-template-columns:1.1fr 1fr 1fr} }
.rt h2,.nextbox h2,.times>h2{white-space:nowrap;min-width:0}
.rt h2 small,.nextbox h2 small,.times>h2 small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- 아이콘 · 제목 표시 (세련된 선 아이콘) ---------- */
.svi{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.icb{flex:none;display:inline-grid;place-items:center;width:4.2vmin;height:4.2vmin;border-radius:1.2vmin;background:var(--chip);color:var(--navy,var(--ink));box-shadow:inset 0 0 0 .15vmin var(--line)}
.icb .svi{width:2.5vmin;height:2.5vmin}
.icb.sm{width:3.4vmin;height:3.4vmin;border-radius:1vmin}
.icb.sm .svi{width:2vmin;height:2vmin}
.times>h2,.nextbox h2{display:flex;align-items:center;gap:1.2vmin}
.nextbox h2 small{align-self:center}
.rtag{flex:none;display:inline-grid;place-items:center;width:3.8vmin;height:3.8vmin;border-radius:1.1vmin;background:var(--rc);color:#fff;box-shadow:0 .5vmin 1.2vmin -.3vmin var(--rc)}
.rtag .svi{width:2.4vmin;height:2.4vmin}
body.one .rt h2 .rtag{width:4.4vmin;height:4.4vmin}
body.one .rt h2 .rtag .svi{width:2.8vmin;height:2.8vmin}
.ttr h3 i.rbar{width:.7vmin!important;height:2.4vmin!important;border-radius:99vmin!important}
.rb-sec h3{display:flex;align-items:center;gap:1vmin}
.rb-ic{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:.4em;background:var(--chip);color:var(--navy,var(--ink));box-shadow:inset 0 0 0 .15vmin var(--line)}
.rb-ic .svi{width:.85em;height:.85em}
.stop .nm .wc{display:inline-flex!important;align-items:center;gap:.4vmin}
.stop .nm .wc .svi{width:1.15em;height:1.15em}
.notice .ntic{flex:none;display:inline-grid;place-items:center;width:4.4vmin;height:4.4vmin;border-radius:1.2vmin;background:rgba(252,211,77,.16)}
.notice .ntic .svi{width:2.8vmin;height:2.8vmin}
body.light .notice .ntic{background:rgba(217,119,6,.12)}
.motto .svi{vertical-align:-.12em}
.rb-r i,.wk .rn i{width:.6vmin!important;height:1.9vmin!important;border-radius:99vmin!important}
.legend i{border-radius:50%!important;width:1.4vmin!important;height:1.4vmin!important}
/* 공지가 떠 있는 쉬는 날(포스터 없음): 칸을 조금 줄여 넘치지 않게 */
body.rest.noposter.hasnotice:not(.portrait) .restbox h2{font-size:3vmin}
body.rest.noposter.hasnotice:not(.portrait) .rb-ic{font-size:4.6vmin}
body.rest.noposter.hasnotice:not(.portrait) .rb-next b{font-size:2.9vmin}
body.rest.noposter.hasnotice:not(.portrait) .wtile .t{font-size:3vmin}
body.rest.noposter.hasnotice:not(.portrait) .wtile{padding:.5vmin .4vmin}
body.rest.noposter.hasnotice:not(.portrait) .wk .c b{font-size:2.1vmin}
body.rest.noposter.hasnotice:not(.portrait) .wk .c{padding:.35vmin .1vmin}
body.rest.noposter.hasnotice:not(.portrait) .rb-sec{padding:.8vmin 1.4vmin;gap:.5vmin}
body.rest.noposter.hasnotice:not(.portrait) .restbox{gap:1vmin;padding:1.4vmin 2vmin}

/* =========================================================
   새 디자인 (body.v2) — 테두리 없이 면·그림자, 같은 크기 칸, 숫자 중심 위계
   ========================================================= */
footer .ft2{display:none}
body.nobanner footer{display:none!important}
body.v2{--v2acc:#D9622B;--v2accS:#FBEDE5;--tagbg:#15171C;--tagink:#fff;--ry:#2F4A9E;--rp:#0E8478;--v2sh:0 .1vmin .2vmin rgba(20,22,30,.04),0 1vmin 3vmin rgba(20,22,30,.07);letter-spacing:-.015em}
body.v2:not(.light){--v2acc:#FFA45C;--v2accS:rgba(255,164,92,.14);--tagbg:#1F2731;--tagink:#F1F3F6;--ry:#8EA4FF;--rp:#2CC9B5;--v2sh:0 .1vmin 0 rgba(255,255,255,.03) inset,0 1vmin 3vmin rgba(0,0,0,.35)}
body.v2 .tv{padding:3vmin 3.6vmin 2.6vmin;gap:2vmin}
body.v2{--mg:2.2vmin}
body.v2 .main{gap:2.2vmin}
body.v2 .boards{gap:2.2vmin}
/* 칸: 테두리 대신 면과 그림자 */
body.v2 .rt,body.v2 .times,body.v2 .mapbox,body.v2 .poster,body.v2 .nextbox,body.v2 .restbox,body.v2 .ticker,body.v2 .hdbg{border:0!important;border-radius:2.6vmin;box-shadow:var(--v2sh)}
body.v2 .rt,body.v2 .times,body.v2 .nextbox{padding:2.2vmin 2.6vmin}
/* 가로 화면: 3칸 × 2줄 같은 크기 (지도만 2줄 높이) */
/* (두 디자인 공통) 3칸 × 2줄 같은 크기 — 지도만 2줄 높이, 칸 사이 간격도 하나로 */
body:not(.rest):not(.portrait) .main{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;grid-template-areas:"map boards times" "map boards times"!important}
body.one:not(.rest):not(.portrait) .main{grid-template-areas:"map boards times" "map next times"!important}
body.pside.mx-split:not(.rest):not(.portrait) .main{grid-template-areas:"map boards times" "map boards ptr"!important}
body.one.pside.mx-split:not(.rest):not(.portrait) .main{grid-template-areas:"map boards times" "map next ptr"!important}
body.one:not(.rest):not(.portrait) .boards .rt{flex:1}
body:not(.portrait) .boards{gap:var(--mg,1.6vmin)!important}
body.rest:not(.noposter):not(.portrait) .main{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:minmax(0,1fr)!important;grid-template-areas:"poster poster rest"!important}

/* 머리 */
body.v2 header h1{font-weight:700;letter-spacing:-.02em}
body.v2 header small{font-weight:400}
body.v2 .clock b{font-weight:600;letter-spacing:-.03em}
body.v2 .clock span{font-weight:400}
body.v2 .logo{border:0;border-radius:1.8vmin}
body.v2 .live{font-weight:600}
/* 글씨 위계: 숫자만 굵고 크게 */
body.v2:not(.w-light) .rt h2,body.v2:not(.w-light) .times>h2,body.v2:not(.w-light) .nextbox h2{font-weight:700}
body.v2 .rt h2 small,body.v2 .times>h2 small,body.v2 .nextbox h2 small{font-weight:400}
body.v2:not(.w-light) .stop .nm b{font-weight:600}
body.v2 .stop .nm span,body.v2 .eta span{font-weight:400}
body.v2:not(.w-light) .eta b{font-weight:650;letter-spacing:-.03em}
body.v2 .stop{border-top-color:var(--line)}
body.v2 .eta.soon b{color:var(--ink)!important}
body.v2 .eta.soon span{display:inline-block;margin-top:.4vmin;color:var(--v2acc);background:var(--v2accS);font-weight:700;padding:.2vmin 1.1vmin;border-radius:99vmin}
body.v2 .eta.sch b{opacity:1}
body.v2 .next{border-top:0}
body.v2 .next b{background:transparent;padding:.2vmin .5vmin;font-weight:400;color:var(--sub)}
body.v2 .next b.first{background:transparent;color:var(--ry);font-weight:700;text-decoration:underline;text-decoration-thickness:.3vmin;text-underline-offset:.6vmin}
body.v2 .rt.park .next b.first{background:transparent;color:var(--rp)}
/* 시간표: 상자 없이 글자만, 다음 차만 노선 색 밑줄 */
body.v2 .ttr{border-top:0!important;padding-top:.6vmin!important}
body.v2 .ttl .lab{font-weight:500}
body.v2 .chips{gap:1vmin 2.2vmin}
body.v2 .chips b{background:transparent!important;box-shadow:none!important;padding:.2vmin 0;color:var(--sub);font-weight:400}
body.v2 .chips b.first{color:var(--ry)!important;font-weight:700;text-decoration:underline;text-decoration-thickness:.3vmin;text-underline-offset:.6vmin}
body.v2 .ttr.park .chips b.first{color:var(--rp)!important}
/* 다음 출발 (평일) */
body.v2 .nx{background:var(--chip);border-radius:1.8vmin}
body.v2:not(.w-light) .nx b{font-weight:650}
body.v2 .nx em{color:var(--v2acc)!important;font-weight:600}
/* 아이콘 배지 */
body.v2 .icb{box-shadow:none;background:var(--chip)}
body.v2 .rtag{box-shadow:none}
/* 지도 범례 */
body.v2 .legend{border:0;border-radius:99vmin;background:var(--card);color:var(--sub);box-shadow:0 .2vmin 1vmin rgba(0,0,0,.08);font-weight:500}
/* 공지 */
body.v2 .notice{border:0;border-radius:1.8vmin;background:var(--v2accS);color:var(--v2acc);font-weight:700}
body.v2 .notice .ntic{background:transparent}
/* 교회 소식 띠 */
body.v2 .ticker{border-radius:1.8vmin}
body.v2 .ticker .tag{background:var(--tagbg);color:var(--tagink);font-weight:700;letter-spacing:.04em}
body.v2 .ticker .tag i{display:none}
body.v2 .tk-track span{font-weight:500}
body.v2 .tk-track span::before{content:"·";color:var(--sub);font-size:2.6vmin;vertical-align:0}
body.v2 .ticker .shine{display:none}
/* 하단 배너: 프로그램 이름 + 안내 · 문의 전화 */
body.v2 footer .ft1,body.v2 footer .ftxt .site{display:none}
body.v2 footer .ft2{display:flex;align-items:baseline;gap:1vmin}
body.v2 footer .ft2 em{font-style:normal;font-size:2.4vmin;font-weight:700;color:var(--ink);letter-spacing:-.01em}
body.v2 footer .ft2 small{font-size:1.75vmin;font-weight:500;color:var(--sub)}
body.v2 footer .ftxt span{font-weight:400}
body.v2 footer .qr{border-radius:1.2vmin;box-shadow:var(--v2sh)}
body.v2 footer .credit .tel{font-weight:600}
body.v2 footer .credit .tel em{font-weight:400}
/* 쉬는 날 */
body.v2 .rb-sec{border:0!important}
body.v2:not(.w-light) .restbox h2{font-weight:700}

.brandtx h1{display:inline-block}
.brandtx small{display:block;width:max-content;white-space:nowrap}
/* ---------- 글자 크기 (관리자 → TV 화면 → 기본 → 글자 크기) ---------- */
:root{--Zg:1;--Zeta:1;--Znext:1;--Zname:1;--Zdesc:1;--Zmap:1;--Ztt:1;--Ztk:1;--Zclk:1}
header h1,header small,.live,.wx,.hmotto,.rt h2,.times>h2,.nextbox h2,.notice,footer .ftxt,footer .credit,.rb-head h2,.rb-memo,.rb-sec h3,.wtile,.wk,.nx .lab,.nx small,.next,.rb-r,.rb-next small,.ttr h3{zoom:var(--Zg)}
.nextbox{overflow:hidden}
.rb-sec,.restbox{overflow:hidden}
.eta,.rb-next>b{zoom:var(--Zeta)}
.nx>b,.nx>em{zoom:var(--Znext)}
.nx.done>b{font-size:3.2vmin!important;color:var(--sub)!important;font-weight:700!important;letter-spacing:0}
.eta.none b{font-size:2.3vmin!important;font-weight:600!important;color:var(--sub)!important;opacity:.85}
.stop .nm b{zoom:var(--Zname)}
.stop .nm>span{zoom:var(--Zdesc)}
.stoplab,.legend{zoom:var(--Zmap)}
.legend span{white-space:nowrap}
.legend{flex-wrap:wrap;row-gap:.4vmin;max-width:calc(100% - 2.4vmin);box-sizing:border-box}
.ttls,.ttr>.ttl{zoom:var(--Ztt)}
.ticker{zoom:var(--Ztk)}
.clock{zoom:var(--Zclk)}
.stop .nm{min-width:0;overflow:hidden}

/* ===== 포스터와 함께 쓰는 안내 칸 (세 가지를 한꺼번에) ===== */
.restbox.r3box{display:flex;flex-direction:column;gap:1.1vmin;padding:2vmin 2.4vmin}
.r3{display:flex;flex-direction:column;gap:.8vmin;flex:none}
.r3-week{flex:1 1 0;min-height:0;overflow:hidden}
.r3+.r3{border-top:.15vmin solid var(--line);padding-top:1.1vmin}
.r3 h3{margin:0;display:flex;align-items:center;gap:1vmin;font-size:2vmin;font-weight:800;color:var(--ink)}
.r3-top{display:flex;align-items:center;gap:1.4vmin}
.r3-ic{flex:none;display:grid;place-items:center;width:5.4vmin;height:5.4vmin;border-radius:1.4vmin;background:var(--chip);color:var(--navy)}
.r3-ic .svi{width:3vmin;height:3vmin}
.r3-tt h2{margin:0;font-size:2.7vmin;font-weight:800;line-height:1.25;word-break:keep-all}
.r3-tt p{margin:.3vmin 0 0;font-size:1.7vmin;color:var(--sub);font-weight:500}
.r3-next{display:flex;flex-direction:column;gap:.6vmin;margin-top:.4vmin}
.r3-nr{display:flex;align-items:baseline;justify-content:space-between;gap:1vmin;background:var(--chip);border-radius:1.2vmin;padding:.7vmin 1.4vmin}
.r3-rn{display:flex;align-items:center;gap:.8vmin;font-size:1.7vmin;color:var(--sub);font-weight:600;white-space:nowrap}
.r3-rn i,.r3-wh i,.r3-one i,.r3-few i{width:.6vmin;height:1.8vmin;border-radius:99vmin;flex:none;display:inline-block}
.r3-nr b{font-size:2.4vmin;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.r3-wg{display:flex;flex-direction:column;gap:.6vmin}
.r3-g{display:grid;grid-template-columns:5.2vmin minmax(0,1fr);gap:1vmin;align-items:start}
.r3-gl{font-size:1.6vmin;font-weight:700;color:var(--sub);padding-top:.35vmin}
.r3-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:2vmin;row-gap:.2vmin}
.r3-it{display:flex;align-items:baseline;justify-content:space-between;gap:.8vmin;border-bottom:.12vmin dashed var(--line);padding:.25vmin 0;min-width:0}
.r3-it .n{font-size:1.85vmin;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r3-it .n small{font-size:1.4vmin;color:var(--sub);font-weight:500}
.r3-it .t{font-size:2.1vmin;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r3-it .t small{font-size:1.3vmin;color:var(--sub);font-weight:500;margin-right:.4vmin}
.r3-wt{display:grid;column-gap:2vmin;row-gap:.2vmin;align-items:center}
.r3-wh{display:flex;align-items:center;gap:.6vmin;font-size:1.5vmin;color:var(--sub);font-weight:600}
.r3-d{font-size:1.8vmin;font-weight:700;color:var(--sub);padding:.35vmin 1vmin;border-radius:.8vmin 0 0 .8vmin;white-space:nowrap}
.r3-d em{font-style:normal;font-size:1.3vmin;margin-left:.6vmin;color:var(--v2acc,#B45309)}
.r3-v{font-size:2vmin;font-weight:600;font-variant-numeric:tabular-nums;padding:.35vmin 1vmin;white-space:nowrap}
.r3-v.off{color:var(--sub);font-weight:400}
.r3-d.today,.r3-v.today{background:var(--chip);color:var(--ink)}
.r3-v.today{border-radius:0 .8vmin .8vmin 0;font-weight:800}
.r3-one{display:none}
.r3-wt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6vmin 1.2vmin;zoom:var(--Zg)}
.r3-wc{display:flex;align-items:baseline;justify-content:space-between;gap:.8vmin;padding:.45vmin 1.1vmin;border-radius:1vmin;background:transparent;box-shadow:inset 0 0 0 .12vmin var(--line);min-width:0}
.r3-wc .d{font-size:1.7vmin;font-weight:700;color:var(--sub);white-space:nowrap}
.r3-wc .d em{font-style:normal;font-size:1.25vmin;margin-left:.5vmin;color:var(--v2acc,#B45309)}
.r3-wc .v{font-size:1.95vmin;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r3-wc .v.off{color:var(--sub);font-weight:400}
.r3-wc.today{background:var(--chip);box-shadow:none}
.r3-wc.today .d{color:var(--ink)}
.r3-few{display:flex;align-items:center;gap:.9vmin;font-size:1.8vmin;margin-top:.2vmin;padding:.6vmin 1.1vmin;border-radius:1vmin;background:var(--chip);min-width:0}
.r3-few b{font-weight:700;white-space:nowrap}
.r3-few span{color:var(--sub);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
body.v2 .r3+.r3{border-top-color:var(--line)}
.r3-tt h2,.r3-nr,.r3 h3,.r3-it,.r3-wt,.r3-few{zoom:var(--Zg)}

/* ===== 세로 TV: 지도 위에 넓게, 아래는 2칸 × 2줄 같은 크기 ===== */
body.portrait:not(.rest) .main{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr)!important;grid-template-areas:"map map" "boards boards" "times times"!important}
body.portrait.one:not(.rest) .main{grid-template-areas:"map map" "boards next" "times times"!important}
body.portrait.pside.mx-split:not(.rest) .main{grid-template-areas:"map map" "boards boards" "times ptr"!important}
body.portrait.one.pside.mx-split:not(.rest) .main{grid-template-areas:"map map" "boards next" "times ptr"!important}
body.portrait:not(.rest) .boards{flex-direction:row;gap:var(--mg,1.6vmin)!important}
body.portrait:not(.rest) .boards .rt{flex:1 1 0;min-width:0}
body.portrait .poster{min-height:0!important}
/* 쉬는 날 (세로 · 포스터 없는 날): 다음 운행 · 예배 안내 · 이번 주 셔틀을 나란히 세 칸 */
body.portrait.rest:not(.noposter) .main{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1.45fr) minmax(0,1fr)!important;grid-template-areas:"poster" "rest"!important}
body.rest.noposter.portrait .r3box{padding:3vmin 3.4vmin;gap:2vmin}
body.rest.noposter.portrait .r3box .r3{zoom:1.45}
body.rest.noposter.portrait .r3box .r3-week{flex:none}
.r3row .r3-few{flex-wrap:wrap;row-gap:.2vmin}
.r3row .r3-few span{white-space:normal}

/* ===== 시간표 칸: 출발 안내판 ===== */
.times{gap:1.4vmin}
.tc-sec{display:flex;flex-direction:column;gap:1.2vmin;min-height:0;flex:1 1 0;overflow:hidden}
.tc-sec>h2{margin:0;display:flex;align-items:center;gap:1.2vmin;font-size:2.7vmin;font-weight:800;zoom:var(--Zg)}
.tc-sec>h2 small{margin-left:auto;font-size:1.7vmin;color:var(--sub);font-weight:500}
.times.tc-both .tc-sec+.tc-sec{border-top:.15vmin solid var(--line);padding-top:1.2vmin}
.tb{flex:1;display:flex;flex-direction:column;gap:1vmin;min-height:0;zoom:var(--Ztt)}
.tb-row{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.8vmin;background:var(--chip);border-radius:1.6vmin;padding:1.1vmin 1.6vmin;position:relative;overflow:hidden}
.tb-row::before{content:"";position:absolute;left:0;top:1.2vmin;bottom:1.2vmin;width:.55vmin;border-radius:0 99vmin 99vmin 0;background:var(--rc)}
.tb-hd{display:flex;align-items:baseline;justify-content:space-between;gap:1vmin;min-width:0}
.tb-lab{font-size:1.8vmin;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.8vmin}
.tb-lab i{display:none}
.tb-last{font-size:1.5vmin;color:var(--sub);font-weight:500;white-space:nowrap}
.tb-ts{display:flex;flex-wrap:wrap;gap:0 .6vmin;height:6.4vmin;overflow:hidden;align-items:center}
.tb-ts>.tb-t{flex:1 0 9vmin;height:6.4vmin}
.tb-t{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5vmin 0;border-radius:1vmin;min-width:0}
.tb-t b{font-size:2.5vmin;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tb-t.first{background:var(--cardA,var(--card));box-shadow:inset 0 0 0 .2vmin var(--rc)}
.tb-t.first b{color:var(--ink);font-weight:800}
.tb-t small{font-size:1.25vmin;color:var(--rc);font-weight:700;white-space:nowrap;margin-top:.1vmin}
.tb-none{font-size:2vmin;color:var(--sub);font-weight:500;padding:.4vmin 0}
.tc-wor .r3-wg{zoom:var(--Ztt)}
.tc-wor .r3-it .n{font-size:2vmin}.tc-wor .r3-it .t{font-size:2.3vmin}
.times.tc-wonly .tc-wor .r3-items{grid-template-columns:minmax(0,1fr)}
body.v2 .tb-row{background:var(--chip)}
/* ===== 쉬는 날 안내 칸: 위 띠 + 아래 같은 크기 두 칸 (세로 · 포스터 없는 가로) ===== */
.restbox.r3box.r3row{flex-direction:column!important;padding:2vmin 2.4vmin;gap:1.6vmin}
.r3row .r3band .r3-head{flex-direction:row;align-items:center;justify-content:space-between;gap:2vmin;padding:0;border:0}
.r3row .r3band .r3-top{min-width:0}
.r3row .r3band .r3-tt h2{font-size:2.6vmin}
.r3row .r3band .r3-next{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;margin:0}
.r3row .r3band .r3-nr{flex-direction:column;align-items:flex-start;gap:.2vmin}
.r3row .r3band .r3-nr b{white-space:nowrap}
.r3pair{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:.15vmin solid var(--line);padding-top:1.6vmin}
.r3pair.n1{grid-template-columns:minmax(0,1fr)}
.r3pair .r3{padding:0 1.8vmin;overflow:hidden;border-top:0!important}
.r3pair .r3:first-child{padding-left:0}
.r3pair .r3:last-child{padding-right:0}
.r3pair .r3+.r3{border-left:.15vmin solid var(--line);padding-top:0}
.r3row .r3{flex:initial}
body.portrait .r3pair .r3-items,body.portrait .r3pair .r3-wt2{grid-template-columns:minmax(0,1fr)}
body.rest.noposter:not(.portrait) .r3row .r3{zoom:1.35}
body.rest.noposter:not(.portrait) .r3row .r3band{zoom:1.15}


/* B. 타임라인 */
.tl{flex:1;display:flex;flex-direction:column;gap:1vmin;min-height:0;zoom:var(--Ztt)}

// ==== MAPKIT START ====  (카카오맵 / OpenStreetMap 공통 지도 — 이 블록은 index·driver·admin·tv에 똑같이 들어갑니다)
// 관리자 설정에 카카오 지도 키(config/kakaoKey)가 있으면 카카오맵, 없거나 불러오지 못하면 OpenStreetMap(Leaflet)을 씁니다.
const MapKit = (()=>{
  const dv=(v,d)=>v==null?d:v; // 오래된 TV 브라우저에서도 동작하도록
  let kakaoReady=null;
  function loadKakao(key){
    if(kakaoReady) return kakaoReady;
    kakaoReady = new Promise((res,rej)=>{
      if(!key) return rej(new Error("no key"));
      const t=setTimeout(()=>rej(new Error("timeout")),8000);
      const sc=document.createElement("script");
      sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
      sc.onload=()=>{ try{ window.kakao.maps.load(()=>{ clearTimeout(t); res(window.kakao); }); }catch(e){ clearTimeout(t); rej(e); } };
      sc.onerror=()=>{ clearTimeout(t); rej(new Error("load error")); };
      document.head.appendChild(sc);
    });
    return kakaoReady;
  }
  // ---------- 카카오맵 ----------
  function kakaoMap(el,opt){
    const K=window.kakao.maps;
    const map=new K.Map(el,{center:new K.LatLng(37.4105,127.145),level:5});
    if(opt.zoomControl) map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);
    const node=html=>{ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild||d; };
    return {
      kind:"kakao",
      layer(){
        const items=new Set();
        return {
          add(lat,lng,html,o={}){
            const ov=new K.CustomOverlay({position:new K.LatLng(lat,lng),content:node(html),xAnchor:.5,yAnchor:.5,zIndex:o.z||1,clickable:false});
            ov.setMap(map); items.add(ov);
            return { move(a,b){ ov.setPosition(new K.LatLng(a,b)); }, html(h){ ov.setContent(node(h)); }, remove(){ ov.setMap(null); items.delete(ov); } };
          },
          clear(){ items.forEach(o=>o.setMap(null)); items.clear(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return;
        const b=new K.LatLngBounds(); pts.forEach(([a,c])=>b.extend(new K.LatLng(a,c)));
        map.setBounds(b,dv(p.top,40),dv(p.right,40),dv(p.bottom,40),dv(p.left,40));
        if(map.getLevel()<(dv(p.minLevel,3))) map.setLevel(dv(p.minLevel,3));
      },
      center(lat,lng,keep){ map.setCenter(new K.LatLng(lat,lng)); if(!keep && map.getLevel()>4) map.setLevel(4); },
      resize(){ map.relayout(); },
      onDrag(cb){ K.event.addListener(map,"dragstart",cb); },
      circle(lat,lng,r,color){ const c=new K.Circle({center:new K.LatLng(lat,lng),radius:r,strokeWeight:2,strokeColor:color,strokeOpacity:.9,strokeStyle:"dash",fillColor:color,fillOpacity:.12}); c.setMap(map);
        return { set(a,b,rr){ c.setPosition(new K.LatLng(a,b)); c.setRadius(rr); }, remove(){ c.setMap(null); } }; },
      onClick(cb){ K.event.addListener(map,"click",e=>cb(e.latLng.getLat(),e.latLng.getLng())); },
      // 선 그리기: pts=[[lat,lng],…], o={color,weight,opacity,dash}
      line(pts,o){ o=o||{}; const mk=(p,oo)=>new K.Polyline({path:p.map(a=>new K.LatLng(a[0],a[1])),strokeWeight:oo.weight||5,strokeColor:oo.color||"#1B2B5C",strokeOpacity:dv(oo.opacity,.8),strokeStyle:oo.dash?"shortdash":"solid",zIndex:oo.z||1});
        let pl=mk(pts,o); pl.setMap(map);
        return { set(p,oo){ pl.setMap(null); pl=mk(p,oo||o); pl.setMap(map); }, remove(){ pl.setMap(null); } }; }
    };
  }
  // ---------- OpenStreetMap (Leaflet) ----------
  function leafletMap(el,opt){
    const map=L.map(el,{zoomControl:!!opt.zoomControl,attributionControl:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    map.setView([37.4105,127.145],14);
    return {
      kind:"osm",
      layer(){
        const g=L.layerGroup().addTo(map);
        return {
          add(lat,lng,html,o={}){
            const ic=h=>L.divIcon({className:"",html:`<div class="mkc">${h}</div>`,iconSize:null,iconAnchor:[0,0]});
            const m=L.marker([lat,lng],{icon:ic(html),interactive:false,zIndexOffset:(o.z||1)*100}).addTo(g);
            return { move(a,b){ m.setLatLng([a,b]); }, html(h){ m.setIcon(ic(h)); }, remove(){ g.removeLayer(m); } };
          },
          clear(){ g.clearLayers(); }
        };
      },
      fit(pts,p={}){
        if(!pts.length) return; map.invalidateSize();
        map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[dv(p.left,40),dv(p.top,40)],paddingBottomRight:[dv(p.right,40),dv(p.bottom,40)],maxZoom:dv(p.maxZoom,16),animate:false});
      },
      center(lat,lng,keep){ map.setView([lat,lng], keep? map.getZoom() : Math.max(map.getZoom()||15,15), {animate:false}); },
      resize(){ map.invalidateSize(); },
      onDrag(cb){ map.on("dragstart",cb); },
      circle(lat,lng,r,color){ const c=L.circle([lat,lng],{radius:r,color,weight:2,dashArray:"6 5",fillColor:color,fillOpacity:.12,interactive:false}).addTo(map);
        return { set(a,b,rr){ c.setLatLng([a,b]); c.setRadius(rr); }, remove(){ map.removeLayer(c); } }; },
      onClick(cb){ map.on("click",e=>cb(e.latlng.lat,e.latlng.lng)); },
      line(pts,o){ o=o||{}; const st=oo=>({color:oo.color||"#1B2B5C",weight:oo.weight||5,opacity:dv(oo.opacity,.8),dashArray:oo.dash?"8 8":null,interactive:false,lineCap:"round",lineJoin:"round"});
        let pl=L.polyline(pts,st(o)).addTo(map);
        return { set(p,oo){ pl.setLatLngs(p); pl.setStyle(st(oo||o)); }, remove(){ map.removeLayer(pl); } }; }
    };
  }
  async function create(el,opt={}){
    if(typeof el==="string") el=document.getElementById(el);
    let key=opt.kakaoKey;
    if(key){
      try{ await loadKakao(key); const m=kakaoMap(el,opt); el.classList.add("is-kakao"); return m; }
      catch(e){ console.warn("카카오맵을 불러오지 못해 OpenStreetMap으로 표시합니다.", e); }
    }
    el.classList.add("is-osm");
    return leafletMap(el,opt);
  }
  return { create };
})();
// 카카오 지도 키: 지난번 받은 값을 먼저 쓰고(빠른 시작), Firebase 설정에서 새 값을 확인
async function getKakaoKey(db, ref, get){
  let cached=null; try{ cached=localStorage.getItem("kakaoKey"); }catch(_){}
  const fresh = get(ref(db,"config/kakaoKey")).then(s=>{ const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){} return v; }).catch(()=>cached||"");
  if(cached){ fresh.then(v=>{ if(v!==cached) console.info("지도 키가 바뀌었습니다. 다음에 열 때 반영됩니다."); }); return cached; }
  return await Promise.race([fresh, new Promise(r=>setTimeout(()=>r(""),7000))]);
}
// 관리자가 지도 키를 넣거나 바꾸면, 열려 있는 화면도 한 번 새로고침해서 바로 바뀌게 함
// (canReload가 false를 돌려주면 — 예: 드라이버 운행 중 — 새로고침하지 않고 다음에 열 때 반영)
function watchKakaoKey(db, ref, onValue, used, canReload){
  onValue(ref(db,"config/kakaoKey"), s=>{
    const v=(s.val()||"").trim(); try{ localStorage.setItem("kakaoKey",v); }catch(_){}
    if(v===(used||"")) return;
    const tag="kkReload:"+v; let done=null; try{ done=sessionStorage.getItem(tag); }catch(_){}
    if(done || (canReload && !canReload())) return;
    try{ sessionStorage.setItem(tag,"1"); }catch(_){}
    location.reload();
  }, ()=>{});
}

  if(st===1){ VS.playing=true; document.body.classList.add("vplay");
    try{ const d=VS.player.getVideoData()||{}; document.body.classList.toggle("vlivenow",!!d.isLive || VID_CFG.src==="channel"); if(d.video_id && d.video_id!==VS.vid){ VS.vid=d.video_id; vidColor(); } }catch(_){} }
  if(st===0){ if(VID_CFG.endAct==="loop" && VID_CFG.src!=="channel"){ try{ VS.player.seekTo(0); VS.player.playVideo(); }catch(_){} return; }
    VS.ended=key; applyMode(); }
}
function vidFail(key){ if(key!==VS.key) return; VS.failKey=key; VS.failAt=Date.now(); applyMode(); }
// 영상 크기: 칸 안에 16:9로 꽉 차게
function fitVid(){ const box=$("pVidIn"), f=$("ytf"); if(!box||!f) return; const W=box.clientWidth, H=box.clientHeight; if(!W||!H) return;
  let w=W, h=W*9/16; if(h>H){ h=H; w=H*16/9; } f.style.width=Math.floor(w)+"px"; f.style.height=Math.floor(h)+"px"; }
window.addEventListener("resize",fitVid); setInterval(fitVid,3000);
// 액자 색: 영상 썸네일의 대표 색 (관리자가 색을 정하면 그 색)
function vidColor(){
  const C=VID_CFG;
  if(/^#[0-9a-fA-F]{6}$/.test(C.color||"")){ const n=parseInt(C.color.slice(1),16); VS.col=[n>>16&255,n>>8&255,n&255]; paintVid(); return; }
  if(!VS.vid){ VS.col=null; paintVid(); return; }
  const im=new Image(); im.crossOrigin="anonymous";
  im.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=32; const g=c.getContext("2d"); g.drawImage(im,0,0,32,32); const d=g.getImageData(0,0,32,32).data; let r=0,gg=0,b=0,ws=0;
    for(let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2], w=1+(Math.max(R,G,B)-Math.min(R,G,B))/40; r+=R*w; gg+=G*w; b+=B*w; ws+=w; } VS.col=[r/ws,gg/ws,b/ws].map(Math.round); }catch(_){ VS.col=null; } paintVid(); };
  im.onerror=()=>{ VS.col=null; paintVid(); };
  im.src=`https://i.ytimg.com/vi/${VS.vid}/mqdefault.jpg?t=${Math.floor(Date.now()/3e5)}`;
}
function paintVid(){ if(!document.body.classList.contains("vid")) return; const c=VS.col || (document.body.classList.contains("light")?[200,190,175]:[60,70,90]); paintRGB(c); }
setInterval(()=>{ if(document.body.classList.contains("vplay") && !/^#/.test(VID_CFG.color||"")) vidColor(); },5*60e3);
// TV 리모컨·화면을 한 번 누르면 소리 켜기 (소리 켜기를 고른 경우)
["click","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{ if(VID_CFG.sound && VS.player){ try{ VS.player.unMute(); VS.player.setVolume(100); }catch(_){} } },{passive:true}));

// ---------- 글꼴 · 날씨 · 교회 표어 (관리자 → TV 화면 → 기본) ----------
const FONT_CSS={gmarket:null, nanumsq:"https://cdn.jsdelivr.net/npm/nanumsquareneo@0.0.5/nanumsquareneo.css", suit:"https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css"};
const FONT_FAM={pretendard:'"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif', gmarket:'"GmarketSans","Pretendard Variable",sans-serif', nanumsq:'"NanumSquareNeo","Pretendard Variable",sans-serif', suit:'"SUIT Variable","SUIT","Pretendard Variable",sans-serif'};
let WX_ON=true;
function applyLook(L){
  const f=FONT_FAM[L.font]?L.font:"pretendard";
  if(FONT_CSS[f] && !document.getElementById("ff-"+f)){ const l=document.createElement("link"); l.rel="stylesheet"; l.id="ff-"+f; l.href=FONT_CSS[f]; document.head.appendChild(l); }
  if(f==="gmarket" && !document.getElementById("ff-gm")){ const st=document.createElement("style"); st.id="ff-gm"; st.textContent='@font-face{font-family:"GmarketSans";font-weight:300;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff") format("woff")}@font-face{font-family:"GmarketSans";font-weight:400 600;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff") format("woff")}@font-face{font-family:"GmarketSans";font-weight:700 900;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff")}'; document.head.appendChild(st); }
  document.documentElement.style.setProperty("--ff",FONT_FAM[f]); setTimeout(fitSub,300); setTimeout(fitSub,1500); document.body.dataset.font=f;
  const w=["bold","normal","light"].includes(L.weight)?L.weight:"bold"; ["normal","light"].forEach(k=>document.body.classList.toggle("w-"+k,w===k));
  const nv={on:L.design==="v2", color:["light","dark","theme"].includes(L.v2color)?L.v2color:"light"};
  document.body.classList.toggle("v2",nv.on); document.body.classList.toggle("nobanner",L.banner===false);
  if(nv.on!==V2.on || nv.color!==V2.color){ V2=nv; try{ applyTheme(); }catch(_){} $("boards")._h=null; $("times")._h=null; setTimeout(()=>{ try{ if(window.tvFit) tvFit(); }catch(_){} fitVid(); },150); }
  // 글자 크기: 전체 배율 × 부분별 단계 (TV 주소 끝 ?fs=110 으로 이 TV만 전체 배율을 바꿀 수도 있음)
  const F=L.fs||{}, ALL=[90,100,110,120], qf=+qs.get("fs"), g=(ALL.includes(qf)?qf:(ALL.includes(+F.all)?+F.all:100))/100;
  const st=v=>1+0.07*Math.max(-5,Math.min(5,Math.round(+v||0)));   // −5 … +5 (한 단계 7%)
  const R=document.documentElement.style, fsig=[g,F.eta,F.next,F.name,F.desc,F.map,F.tt,F.tk,F.clk].join();
  if(fsig!==window.__fsig){ window.__fsig=fsig;
    R.setProperty("--Zg",g); R.setProperty("--Zeta",(g*st(F.eta)).toFixed(3)); R.setProperty("--Znext",(g*st(F.next)).toFixed(3)); R.setProperty("--Zname",(g*st(F.name)).toFixed(3)); R.setProperty("--Zdesc",(g*st(F.desc)).toFixed(3)); R.setProperty("--Zmap",(g*st(F.map)).toFixed(3));
    R.setProperty("--Ztt",(g*st(F.tt)).toFixed(3)); R.setProperty("--Ztk",(g*st(F.tk)).toFixed(3)); R.setProperty("--Zclk",(g*st(F.clk)).toFixed(3));
    setTimeout(()=>{ try{ tkSig=""; drawTicker(); if(window.tvFit) tvFit(); fitVid(); fitSub(); }catch(_){} },150); }
  // 칸 안 배치: 정렬(위·가운데·아래·고르게) · 줄 간격(−2 ~ +2). 제목은 늘 위에 그대로
  const va=["top","center","bottom","spread"].includes(L.valign)?L.valign:"spread"; ["top","center","bottom","spread"].forEach(k=>document.body.classList.toggle("va-"+k,va===k));
  const vk={"-2":.45,"-1":.72,"0":1,"1":1.4,"2":1.85}[String(Math.max(-2,Math.min(2,Math.round(+L.vgap||0))))]; document.documentElement.style.setProperty("--vk",vk);
  WX_ON = L.wx!==false; if(!WX_ON) $("wx").classList.add("hide"); else if($("wxT").textContent!=="--°") $("wx").classList.remove("hide");
  const m=String(L.motto||"").trim(), on=!!L.mottoOn && !!m;
  $("hMotto").classList.toggle("hide",!on); $("hMottoT").textContent=m; document.body.classList.toggle("hasmotto",on);
}
if(qs.get("preview")==="1") document.body.classList.add("preview");
// ---------- QR (성도님 주소) ----------
try{
  const url=location.origin+location.pathname.replace(/[^/]*$/,"");
  const q=qrcode(0,"M"); q.addData(url); q.make();
  QR_IMG=q.createDataURL(8,0);
  $("qr").innerHTML=`<img src="${QR_IMG}" alt="" style="width:100%;height:100%;image-rendering:pixelated">`;
}catch(_){ $("qr").classList.add("hide"); }

// ---------- 시작 ----------
(async()=>{
  RT=computeRT(); document.body.classList.toggle("one",RT.length===1); drawLegend();
  applyTheme(); loadWx(); setInterval(loadWx, 30*60e3);
  await initMap(); drawTvPaths();
  ["yatap","park"].forEach(r=>onValue(ref(db,"waitc/"+r), s=>{ WAITC[r]=s.val()||{}; drawBoards(); }, ()=>{}));
  onValue(ref(db,"live"), s=>{ const v=s.val()||{}; LIVE={yatap:v.yatap||{},park:v.park||{}}; applyRT(); drawMap(); drawBoards(); });
  onValue(ref(db,"config"), s=>{ const c=s.val()||{}; applyBrand(c); WAIT_CFG=c.waitCfg||{};
    TV_ROUTES=["auto","both","yatap","park"].includes(c.tvRoutes)?c.tvRoutes:"auto";
    const tr=c.tvRest||{}; REST_CFG={afterEnd: tr.afterEnd!==false, beforeFirst: tr.beforeFirst!==false, dates: tr.dates||{}, verse: tr.verse||"", verseRef: tr.verseRef||"", worship: tr.worship||"", worshipList: tr.worshipList||null, motto: tr.motto||"", mottoRef: tr.mottoRef||"", mottoVerse: tr.mottoVerse||"", verses: tr.verses||"", verseMode: tr.verseMode||"", verseEvery: tr.verseEvery||"day", secs: tr.secs||null};
    const pc=c.tvPosters||{}; POSTER_CFG={when:["rest","always","off"].includes(pc.when)?pc.when:"rest", sec:pc.sec||8, view:pc.view||"one", mix:pc.mix||"alt"}; PS.view="";
    applyLook(c.tvLook||{}); applyNames(c.tvLook||{}); POSTER_META=c.tvPosterList||{}; $("nextBox")._h=null; $("restBox")._h=null;
    const cl=(c.tvLook||{}).cell||{}; CELL={sun:cl.sun||"times", wk:cl.wk||"times"};
    TTS=["card","line","ring"].includes((c.tvLook||{}).tts)?(c.tvLook||{}).tts:"line"; DAYBAR=(c.tvLook||{}).daybar!==false; $("times")._h=null;
    const nv=c.tvVideo||{}, vsig=JSON.stringify(VID_CFG); VID_CFG=nv; if(JSON.stringify(nv)!==vsig){ VS.key="#"; syncVideo(""); VS.ended=""; VS.failKey=""; }
    applyRT();
    if(applyStops(c.stops)) drawStopMarks();
    NEWS_CFG=c.news||null; drawTicker();
    THEME_CFG=c.tvTheme||{}; watchPhoto(); applyTheme();
    if(applyPaths(c.paths)) drawTvPaths();
    PARK_TIMES=parseTimes(c.parkTimes); TIMES=c.times||{};
    const n=c.notice, show=n&&n.on&&n.text; $("notice").classList.toggle("hide",!show); document.body.classList.toggle("hasnotice",!!show);
    if(show) $("notice").innerHTML=`<span class="ntic">${ic("mega")}</span><span>${esc(n.text)}</span>`;
    $("boards")._h=null; drawBoards(); try{ applyMode(); }catch(_){} });
  setInterval(()=>{ applyRT(); drawMap(); drawBoards(); },4000);
  setInterval(drawTicker,60e3); // 날짜가 바뀌면 지난 소식 내리기
  tickClock(); setInterval(tickClock,1000);
  keepAwake();
})();
</script>
